# Arka Plan Ayarları
background {
    monitor =
    path = /home/mary/.config/wallpaper/793989.jpg  # Kendi görsel yolunuzu yazın
    blur_passes = 2 # Arka planı bulanıklaştırma derecesi
    blur_size = 7
}

# Şifre Giriş Kutusu
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33 # Şifre noktalarının boyutu
    dots_spacing = 0.15 
    dots_center = true
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = false
    placeholder_text = <i>Şifre giriniz...</i> # Giriş kutusu yazısı
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

# Saat Göstergesi
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(200, 200, 200, 1.0)
    font_size = 55
    font_family = Noto Sans
    position = 0, 80
    halign = center
    valign = center
}
